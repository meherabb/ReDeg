  <text class="ax sans" x="660" y="298" text-anchor="middle">target tile, existing blur <tspan font-style="italic">s</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> = 6 px²</tspan></text>
  <text class="ax sans" x="660" y="66" text-anchor="middle" style="fill:#f0883e">re-blurred by <tspan font-style="italic">η</tspan> →</text>
</g>
