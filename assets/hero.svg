<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">Blur an image again, and it tells you how blurred it already was</title>
<desc id="d">Animation: a target tile with an existing blur of 6 px^2 is re-blurred by an increasing variance eta; a dot travels along the response curve rho(eta) = 1 - (1 + eta/s0)^-gamma, which removes half of the gradient energy near eta = s0.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
  .serif { font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', 'DejaVu Serif', Georgia, 'Times New Roman', serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .t { fill: #e6edf3; }
  .m { fill: #8b949e; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .ttl { font: 700 31px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; fill: #e6edf3; letter-spacing: -0.3px; }
  .kick { font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; fill: #58a6ff; letter-spacing: 2.4px; }
  .body { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; fill: #8b949e; }
  .ax { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; fill: #8b949e; }
  .eq { font: italic 400 19px 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', 'DejaVu Serif', Georgia, 'Times New Roman', serif; fill: #e6edf3; }
  .lab { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
  .reveal { animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both; }
  .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .8s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.35); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#161b22"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="reblur" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="1.531">
      <animate attributeName="stdDeviation" values="1.531;1.534;1.537;1.541;1.546;1.551;1.558;1.566;1.576;1.588;1.603;1.620;1.640;1.665;1.694;1.729;1.770;1.819;1.877;1.944;2.023;2.114;2.219;2.341;2.480;2.639;2.819;3.024;3.254;3.513;3.803;4.127;4.489;4.891;5.338;5.834;6.383;6.383;1.531" keyTimes="0.0000;0.0200;0.0400;0.0600;0.0800;0.1000;0.1200;0.1400;0.1600;0.1800;0.2000;0.2200;0.2400;0.2600;0.2800;0.3000;0.3200;0.3400;0.3600;0.3800;0.4000;0.4200;0.4400;0.4600;0.4800;0.5000;0.5200;0.5400;0.5600;0.5800;0.6000;0.6200;0.6400;0.6600;0.6800;0.7000;0.7200;0.9000;1.0000" dur="9.0s" repeatCount="indefinite"/>
    </feGaussianBlur>
  </filter>
  <clipPath id="disc"><circle cx="660" cy="176" r="92"/></clipPath>
  <linearGradient id="curveg" x1="0" x2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="358" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
<g class="sans">
  <text class="kick reveal" x="48" y="62">GAUSSIAN BLURS ADD IN VARIANCE</text>
  <text class="ttl reveal d1" x="48" y="108">Blur an image again,</text>
  <text class="ttl reveal d2" x="48" y="148">and it tells you how blurred</text>
  <text class="ttl reveal d2" x="48" y="188">it already was.</text>
  <g class="reveal d3">
    <rect x="48" y="214" width="320" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="eq" x="64" y="243">ρ(η) = 1 − (1 + η/s<tspan dy="5" font-size="14">0</tspan><tspan dy="-5">)</tspan><tspan dy="-9" font-size="14">−γ</tspan></text>
  </g>
  <text class="body reveal d4" x="48" y="290">A known re-blur <tspan font-style="italic">η</tspan> removes a share <tspan font-style="italic">ρ</tspan> of the gradient</text>
  <text class="body reveal d4" x="48" y="313">energy; half of it is gone near <tspan font-style="italic">η</tspan> = <tspan font-style="italic">s</tspan><tspan dy="4" font-size="12">0</tspan><tspan dy="-4">, the blur</tspan></text>
  <text class="body reveal d4" x="48" y="336">the image already carries.</text>
</g>
